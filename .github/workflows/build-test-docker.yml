name: Check integrated test Docker image

on:
  push:
    branches:
      - test/integrated-20260913

permissions:
  contents: read

concurrency:
  group: integrated-test-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/sub-check.yml
    with:
      PHP_VERSION: '8.2'

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Set test image version
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          jq \
            --arg version '4.6.0-br-test-integrated-20260913' \
            --arg sha "$short_sha" \
            '.version = $version | .sha = $sha | .installation = "docker" | .github = "https://github.com/avissian/webtlo"' \
            version.json > version.tmp.json
          mv version.tmp.json version.json
          jq -e '.version == "4.6.0-br-test-integrated-20260913" and .installation == "docker" and (.sha | length == 7)' version.json

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: false
          load: true
          provenance: false
          platforms: ${{ matrix.platform }}
          tags: webtlo:integrated-test

      - name: Check image version
        run: |
          docker run --rm --platform '${{ matrix.platform }}' --entrypoint cat \
            webtlo:integrated-test /var/www/webtlo/version.json \
            | jq -e '.version == "4.6.0-br-test-integrated-20260913" and .installation == "docker" and (.sha | length == 7)'
