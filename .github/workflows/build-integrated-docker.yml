name: Build integrated Docker image

on:
  push:
    branches:
      - integrated-4.6

permissions:
  contents: read

concurrency:
  group: integrated-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_VERSION: '4.6.1-fork.1'

jobs:
  validate:
    if: github.repository == 'avissian/webtlo'
    uses: ./.github/workflows/sub-check.yml
    with:
      PHP_VERSION: '8.4'

  build:
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set image version
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          jq \
            --arg version "$IMAGE_VERSION" \
            --arg sha "$short_sha" \
            '.version = $version | .sha = $sha | .installation = "docker" | .github = "https://github.com/avissian/webtlo"' \
            version.json > version.tmp.json
          mv version.tmp.json version.json
          jq -e --arg expected "$IMAGE_VERSION" \
            '.version == $expected and .installation == "docker" and (.sha | length == 7)' version.json

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: false
          pull: true
          no-cache: true
          load: true
          provenance: false
          platforms: linux/${{ matrix.arch }}
          tags: webtlo:integrated
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Check image version
        run: |
          docker run --rm --entrypoint cat \
            webtlo:integrated /var/www/webtlo/version.json \
            | jq -e --arg expected "$IMAGE_VERSION" \
                '.version == $expected and .installation == "docker" and (.sha | length == 7)'

      - name: Check PHP-FPM, application and worker status
        run: bash docker/smoke-test.sh webtlo:integrated --worker-status

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested architecture image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$IMAGE:integrated-4.6-$GITHUB_SHA-$ARCH"
          docker tag webtlo:integrated "$tag"
          docker push "$tag"

  publish:
    if: github.repository == 'avissian/webtlo'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested multi-platform image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:integrated-4.6" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE:integrated-4.6-$GITHUB_SHA-amd64" \
            "$IMAGE:integrated-4.6-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:integrated-4.6"
          echo "Published: \`$IMAGE:sha-$GITHUB_SHA\` (amd64, arm64)" >> "$GITHUB_STEP_SUMMARY"
