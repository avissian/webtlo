name: Build patched PHP Docker image

on:
  push:
    branches:
      - fix/docker-php-security
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-php-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'avissian/webtlo'
    uses: ./.github/workflows/sub-check.yml
    with:
      PHP_VERSION: '8.4'

  build:
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set Docker build metadata
        run: |
          jq --arg sha "${GITHUB_SHA:0:7}" \
            '.sha=$sha | .installation="docker"' version.json > version.json.tmp
          mv version.json.tmp version.json

      - uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: true
          load: true
          tags: webtlo:smoke
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Check PHP-FPM and application startup
        run: bash docker/smoke-test.sh webtlo:smoke

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested architecture image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$IMAGE:php-security-$GITHUB_SHA-$ARCH"
          docker tag webtlo:smoke "$tag"
          docker push "$tag"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:php-security" \
            --tag "$IMAGE:php-security-${GITHUB_SHA:0:7}" \
            "$IMAGE:php-security-$GITHUB_SHA-amd64" \
            "$IMAGE:php-security-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:php-security"
          echo "Published: \`$IMAGE:php-security-${GITHUB_SHA:0:7}\` (amd64, arm64)" >> "$GITHUB_STEP_SUMMARY"
